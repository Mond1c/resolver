[versions]
androidx-lifecycle = "2.11.0-beta01"
composeMultiplatform = "1.11.1"
junit = "4.13.2"
kotlin = "2.4.0"
kotlin-wrappers = "2026.6.1"
kotlinx-coroutines = "1.11.0"
ktor = "3.5.0"
material3 = "1.11.0-alpha07"
live-v3 = "v3.5.0"
logger = "1.5.32"
shadow = "9.4.1"
coroutines = "1.10.2"
serialization = "1.10.0"
node = "7.1.0"
clikt = "5.1.0"
metro = "1.2.1"
buildconfig = "6.0.10"
kotlinx-collections-immutable = "0.5.0"

[libraries]
cli = { version.ref = "clikt", group = "com.github.ajalt.clikt", name = "clikt" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
wrappers-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser", version.ref = "kotlin-wrappers" }
serialization = { version.ref = "serialization", group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json" }
coroutines = { version.ref = "coroutines", group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core" }
logger = { version.ref = "logger", group = "ch.qos.logback", name = "logback-classic" }
ktor-server-netty = { version.ref = "ktor", group = "io.ktor", name = "ktor-server-netty" }
ktor-server-core = { version.ref = "ktor", group = "io.ktor", name = "ktor-server-core" }
ktor-server-routing = { version.ref = "ktor", group = "io.ktor", name = "ktor-server-routing" }
ktor-server-host-common = { version.ref = "ktor", group = "io.ktor", name = "ktor-server-host-common" }
ktor-server-websockets = { version.ref = "ktor", group = "io.ktor", name = "ktor-server-websockets" }
ktor-client-websockets = { version.ref = "ktor", group = "io.ktor", name = "ktor-client-websockets" }
ktor-client-cio = { version.ref = "ktor", group = "io.ktor", name = "ktor-client-cio" }
ktor-client-js = { version.ref = "ktor", group = "io.ktor", name = "ktor-client-js" }
ktor-client-core = { version.ref = "ktor", group = "io.ktor", name = "ktor-client-core" }
kotlinx-collections-immutable = { version.ref = "kotlinx-collections-immutable", group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable" }
full = { version.ref = "live-v3", group = "com.github.icpc.live-v3", name = "org.icpclive.cds.full" }
kotlin-junit = { version.ref = "kotlin", group = "org.jetbrains.kotlin", name = "kotlin-test-junit5" }
kotlinx-coroutines-test = { version.ref = "coroutines", group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test" }

[plugins]
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
gradle-shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
node = { id = "com.github.node-gradle.node", version.ref = "node" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }